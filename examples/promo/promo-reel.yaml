title: This isn't my real voice
format: vertical
handle: "@inguzdev"
theme: midnight
accent: "#FFE14D"
voice: inguz
music: upbeat
caption: >-
  This isn't my real voice, and I didn't edit this video. I wrote a few lines of plain text and the open-source tool
  I built turned it into this, in a clone of my voice. No paid AI needed. Comment REPO and I'll send you the link.
hashtags: [ai, opensource, voiceclone, mcp, devtools]
beats:
  - kind: hook
    eyebrow: Not a real recording
    text: This isn't my real voice.
    say: This isn't my real voice. It's a clone. And I didn't edit this video. I just wrote it down.
    background: {scene: voice, params: {text: "", on: 0}}
  - kind: scene
    scene: script
    head: Just write it
    say: I wrote a few lines of plain text. No paid AI needed. My open-source tool turned them into this.
    params:
      paragraphs:
        - This isn't my real voice.
        - I wrote a few lines of plain text.
        - Comment REPO for the link.
      on: [wrote, paid, turned]
  - kind: scene
    scene: voice
    head: It checks itself
    say: It clones your voice in a minute, and re-records any word it gets wrong.
    params: {text: Give it a star if this fooled you, wrong: {index: 3, heard: start}, on: clones}
  - kind: scene
    scene: formats
    head: Every platform
    say: Reels, YouTube, LinkedIn. One script.
    params: {on: [Reels, YouTube, LinkedIn]}
  - kind: end
    text: Comment REPO for the link
    say: Want it? Comment repo, and I'll send you the link.
