title: I didn't edit this video
format: vertical
handle: "@inguzdev"
theme: midnight
accent: "#FFE14D"
voice: inguz
music: upbeat
caption: >-
  I didn't edit this video. My open-source tool did. And the voice isn't mine either: the tool cloned it from one
  minute of my recordings. All I wrote was a few lines of text, no paid AI. Comment REPO and I'll send you the link.
hashtags: [ai, opensource, voiceclone, devtools, buildinpublic]
beats:
  - kind: hook
    eyebrow: Not edited by me
    text: I didn't edit this video.
    say: I didn't edit this video. My open-source tool did. And this voice isn't mine either. My tool cloned it.
    background: {scene: voice, params: {text: "", on: 0}}
  - kind: scene
    scene: script
    head: All I did was write
    say: All I did was write a few lines of text. No editor, no paid AI.
    params:
      paragraphs:
        - I didn't edit this video.
        - All I did was write a few lines of text.
        - Comment REPO for the link.
      on: [write, text, paid]
  - kind: scene
    scene: voice
    head: It checks itself
    say: It even listens to its own voice, and re-records any word it gets wrong.
    params: {text: Give it a star if this fooled you, wrong: {index: 3, heard: start}, on: listens}
  - kind: scene
    scene: formats
    head: Every platform
    say: Reels, YouTube, LinkedIn. One script.
    params: {on: [Reels, YouTube, LinkedIn]}
  - kind: end
    text: Comment REPO for the link
    say: Want it? Comment repo, and I'll send you the link.
